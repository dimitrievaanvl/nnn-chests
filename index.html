}

function bindAnswers() {

  const ok=t.kind==='multi' ? selected.size===t.correct.length&&t.correct.every(i=>selected.has(i)) : selected.has(t.kind==='truth'?(t.correct?0:1):s.correct);
  attempts++; $$('[data-answer]').forEach(b=>b.disabled=true);
  if(!ok) {errors++;phase='retry';$('#feedback').textContent='Пока неверно. Подсказка: '+(s.hint|| (isAlgorithm()?'Проверьте вопрос и признаки слова. Опора: '+s.answers[s.correct]+'.':t.explain))+' Можно открыть памятку и повторить попытку.';$('#checkAnswer').textContent='Попробовать ещё раз';return;}
  $$('[data-answer]').filter(b=>selected.has(Number(b.dataset.answer))).forEach(b=>b.classList.add('good'));
  if(isAlgorithm()&&step<stages().length-1) {step++;renderStep();return;}
  phase='correct';$('#feedback').textContent='Верно! '+t.explain;
  if(t.kind==='chest') {$('#chestScene').src=$('#openChest').src;$('#chestScene').alt='Открытый сундук';$('#locks').innerHTML=stages().map(()=>'<span class="lock done">✓</span>').join('');}
  if(t.kind==='swamp') $('#swampSuccess').classList.add('show');
  $('#checkAnswer').textContent=index===tasks.length-1?'Завершить':'Дальше';
}
function finish() {
  phase='finished'; $('#quest').innerHTML='<div class="session-result"><div class="big">'+tasks.length+'/'+tasks.length+'</div><h3>Испытание завершено</h3><p>Все задания выполнены верно'+(errors?' с повторными попытками':' с первой попытки')+'.</p><p>Проверок: '+attempts+'. Ошибочных попыток: '+errors+'.</p><p class="nn-secret-instruction">Введите в поле ответа: <strong>'+esc(secret)+'</strong></p><button class="primary" id="nnRetry">Пройти ещё раз</button></div>';
  $('#checkAnswer').hidden=true; $('#restart').hidden=true; $('#nnRetry').onclick=start;
}
let previousFocus;
function closeMemo() {$('#theoryModal').classList.remove('open');previousFocus?.focus();}
$('#theoryPreview').onclick=()=>{previousFocus=document.activeElement;$('#theoryModal').classList.add('open');$('#closeMemo').focus();};
$('#closeMemo').onclick=closeMemo;
$('#theoryModal').onclick=e=>{if(e.target===$('#theoryModal'))closeMemo();};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeMemo();
  if(e.key==='Tab'&&$('#theoryModal').classList.contains('open')) {const items=[$('#closeMemo'),...$$('[data-page]')];if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus();}}
});
$$('[data-page]').forEach(b=>b.onclick=()=>{const page=Number(b.dataset.page);$('#memoImage').src=$('#memoSource'+page).src;$('#memoImage').alt='Памятка Н и НН, страница '+(page+1);$$('[data-page]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});});
$('#memoImage').src=$('#memoSource0').src;
$('#checkAnswer').onclick=check;$('#restart').onclick=start;
start();
</script></body></html>
